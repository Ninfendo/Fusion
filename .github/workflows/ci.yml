name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  wasm:
    name: Browser build (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every crate the browser client will use must build for wasm32.
      - run: cargo build --locked --target wasm32-unknown-unknown -p fusion-domain -p fusion-layout -p fusion-theme -p fusion-client-core -p fusion-ui-egui -p fusion-web
      - name: Lint the browser build
        run: cargo clippy --locked --target wasm32-unknown-unknown -p fusion-web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Package the browser app (report its size)
        run: |
          trunk build --release apps/fusion-web/index.html
          {
            echo "## Browser app"
            echo "| File | Bytes |"
            echo "| --- | --- |"
            for f in apps/fusion-web/dist/*.wasm apps/fusion-web/dist/*.js; do
              echo "| $(basename "$f") | $(stat -c %s "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The floor only goes up. Binaries are thin composition roots and are
      # left out; everything with logic lives in a library crate.
      - name: Measure line coverage (floor 95%)
        run: >
          cargo llvm-cov --workspace --ignore-filename-regex "apps/" --locked
          --summary-only --show-missing-lines --fail-under-lines 95
          | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Unused dependencies and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
      - uses: crate-ci/typos@v1.51.1

  mutants:
    name: Mutation testing (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A mutant that does not compile cleanly is skipped, not a failure.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - uses: Swatinem/rust-cache@v2
      - name: Mutate only the lines this pull request changes
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          cargo mutants --in-diff pr.diff --no-shuffle --timeout-multiplier 3
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore

  cyclomatic:
    name: Cyclomatic complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install lizard==1.24.1
      # lizard counts every branch, including each match arm. It does not see
      # `const fn`; clippy's cognitive complexity covers those. Test code is
      # left out: long tables of cases are fine in tests.
      - name: Every function at most 15 (cyclomatic), 80 lines, 6 arguments
        run: >
          lizard -l rust --CCN 15 --length 80 --arguments 6 --warnings_only
          -x "*/tests/*" -x "*/tests.rs" crates apps
      - name: Most complex functions
        if: always()
        run: |
          {
            echo '## Cyclomatic complexity: the 15 highest'
            echo '```'
            echo 'NLOC  CCN  token  PARAM  length  function'
            lizard -l rust -x "*/tests/*" -x "*/tests.rs" crates apps \
              | grep '@' | sort -k2 -n -r | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
