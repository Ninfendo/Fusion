name: Mutation testing (full)

# Pull requests mutate only the lines they change. This weekly run mutates
# everything, to catch tests that got weaker over time.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: Mutation testing (all code)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/postgres
      - run: cargo mutants --no-shuffle --timeout-multiplier 3
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore
