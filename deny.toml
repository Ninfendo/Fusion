# cargo-deny: licences, security advisories, banned crates and sources.
# Runs in CI on every push and pull request.

[graph]
all-features = true

[advisories]
# Security advisories block for every crate. "Unmaintained" notices block
# only for crates we depend on directly: a crate deep inside egui's tree is
# egui's to replace, and we cannot.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licences only. A copyleft crate (GPL, AGPL, LGPL) needs a
# conscious decision and an entry in `exceptions`, never a quiet allow.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8
# The allow list is policy, not a record of what is in use today.
unused-allowed-license = "allow"
# Font licences, for the fonts egui ships and nothing else.
exceptions = [
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # Mozilla's list of root certificates, as data. reqwest's certificate
    # check uses it where the system has no list of its own.
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
