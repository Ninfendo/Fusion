[package]
name = "fusion-client-link"
description = "The client's line to the view server: a WebSocket that reconnects by itself, native on desktop and the browser's own in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
fusion-protocol.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["BinaryType", "CloseEvent", "MessageEvent", "WebSocket", "Window"] }

[dev-dependencies]
fusion-domain.workspace = true
fusion-serve.workspace = true

[lints]
workspace = true
