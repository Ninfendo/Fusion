[package]
name = "fusion-web"
description = "The Fusion app in the browser, built with Trunk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
fusion-client-core.workspace = true
fusion-hub.workspace = true
fusion-layout.workspace = true
fusion-ui-egui.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "BroadcastChannel",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "Storage",
    "Window",
] }

[lints]
workspace = true
