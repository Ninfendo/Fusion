<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Fusion</title>

    <!-- Trunk builds this crate to WebAssembly and links it here. -->
    <link data-trunk rel="rust" data-bin="fusion-web" data-wasm-opt="2" />
    <base data-trunk-public-url />

    <style>
        html, body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #15171a;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e6e8eb;
            font: 16px system-ui, sans-serif;
        }
    </style>
</head>

<body>
    <canvas id="fusion-canvas"></canvas>
    <div id="loading">
        <noscript>Fusion needs JavaScript.</noscript>
        <p>Loading Fusion…</p>
    </div>
</body>
</html>
