[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ninfendo/Fusion"
authors = ["Fredrik Karlsson Peraldi"]
publish = false

[workspace.dependencies]
fusion-domain = { path = "crates/fusion-domain" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Many small crates: without LTO, small non-generic functions are not inlined
# across crate boundaries, which costs speed in hot loops.
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
