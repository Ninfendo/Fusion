[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ninfendo/Fusion"
authors = ["Fredrik Karlsson Peraldi"]
publish = false

[workspace.dependencies]
fusion-domain = { path = "crates/fusion-domain" }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
interprocess = "2.4.6"
tokio = { version = "1.54.0", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# TLS on ring: no CMake or NASM needed on Windows (aws-lc-rs needs them).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
prost = "0.14.4"
prost-build = "0.14.4"
# A Protobuf compiler in Rust: no protoc to install, here or in CI.
protox = "0.10.0"
# CEL for viewport filters; without its date and time-zone support.
cel = { version = "0.15.0", default-features = false, features = ["regex"] }
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
fusion-layout = { path = "crates/fusion-layout" }
fusion-theme = { path = "crates/fusion-theme" }
fusion-client-core = { path = "crates/fusion-client-core" }
fusion-hub = { path = "crates/fusion-hub" }
fusion-pipe = { path = "crates/fusion-pipe" }
fusion-launch = { path = "crates/fusion-launch" }
fusion-venue-binance = { path = "crates/fusion-venue-binance" }
fusion-recording = { path = "crates/fusion-recording" }
fusion-protocol = { path = "crates/fusion-protocol" }
fusion-viewserver = { path = "crates/fusion-viewserver" }
fusion-serve = { path = "crates/fusion-serve" }
fusion-sim = { path = "crates/fusion-sim" }
fusion-client-link = { path = "crates/fusion-client-link" }
fusion-persistence-pg = { path = "crates/fusion-persistence-pg" }
fusion-egui-theme = { path = "crates/fusion-egui-theme" }
fusion-egui-dock = { path = "crates/fusion-egui-dock" }
fusion-ui-egui = { path = "crates/fusion-ui-egui" }
egui = "0.37.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_tiles = "0.18.0"
# Tables only: no image or file loaders.
egui_extras = { version = "0.37.0", default-features = false }
egui_kittest = "0.37.0"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# CI turns every warning into an error. Limits for the complexity lints are in
# clippy.toml.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Many small crates: without LTO, small non-generic functions are not inlined
# across crate boundaries, which costs speed in hot loops.
# Debug builds: optimise the libraries (egui, wgpu and so on) once, so the
# app runs smoothly during development while our own code builds fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
